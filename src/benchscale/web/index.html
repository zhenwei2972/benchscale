<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>benchscale</title>
<style>
  :root {
    --bg: #f5f6f4; --panel: #ffffff; --ink: #1b2420; --muted: #5d6b64; --line: #dce2dd;
    --accent: #1f7a5a; --accent-ink: #ffffff; --ok: #1f7a5a; --fail: #b3261e; --info: #5d6b64;
    --part: #d08a3c; --ghost: #7fa7c9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101413; --panel: #171d1b; --ink: #e6ece8; --muted: #9aa8a1; --line: #2a332f;
      --accent: #4cc496; --accent-ink: #0d1411; --ok: #4cc496; --fail: #ff8a80; --info: #9aa8a1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101413; --panel: #171d1b; --ink: #e6ece8; --muted: #9aa8a1; --line: #2a332f;
    --accent: #4cc496; --accent-ink: #0d1411; --ok: #4cc496; --fail: #ff8a80; --info: #9aa8a1;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .tag { color: var(--muted); font-size: 13px; }
  header select { margin-left: auto; font: inherit; padding: 5px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  #stage { position: relative; min-height: 320px; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; left: 12px; top: 10px; font-size: 13px; color: var(--muted);
    background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 6px 10px; border-radius: 8px; }
  #overlay b { color: var(--ink); }
  #toggles { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 6px 10px; border-radius: 8px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    text-align: center; padding: 24px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    display: flex; flex-direction: column; min-height: 0; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .check { display: grid; grid-template-columns: 18px 1fr; gap: 6px; padding: 4px 0; }
  .check .mark { font-weight: 700; }
  .ok .mark { color: var(--ok); } .fail .mark { color: var(--fail); } .info .mark { color: var(--info); }
  .check small { display: block; color: var(--muted); }
  .basis { font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 4px; color: var(--muted); }
  .ref a { color: var(--accent); }
  .ref small { color: var(--muted); display: block; }
  ul.notes { margin: 0; padding-left: 18px; color: var(--muted); }
  code { font-size: 12px; word-break: break-all; }
  #chat { flex: 1; display: flex; flex-direction: column; min-height: 260px; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .msg { padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; }
  .msg.user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; max-width: 90%; }
  .msg.bot { background: var(--bg); border: 1px solid var(--line); max-width: 95%; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; font: inherit; resize: vertical; min-height: 44px; padding: 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent);
    color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>benchscale</h1>
  <span class="tag">lab apparatus, designed at real scale</span>
  <select id="designs" aria-label="Design"></select>
</header>
<main>
  <div id="stage">
    <div id="empty">No design yet. Ask for one in the chat, from Claude through the MCP server, or run<br><code>benchscale design tip_box_dock</code></div>
    <div id="overlay" hidden></div>
    <div id="toggles" hidden>
      <label><input type="checkbox" id="showGhosts" checked> Show what it holds</label>
      <label><input type="checkbox" id="printPose"> Print orientation</label>
    </div>
  </div>
  <aside>
    <section id="about" hidden><h2>Design</h2><div id="aboutBody"></div></section>
    <section id="checks" hidden><h2>Checks</h2><div id="checkList"></div></section>
    <section id="holds" hidden><h2>Built around</h2><div id="refList"></div></section>
    <section id="filesSec" hidden><h2>Files</h2><div id="files"></div></section>
    <section id="chat">
      <h2>Chat</h2>
      <div id="log"></div>
      <form id="form">
        <textarea id="input" placeholder="e.g. A dock that tilts our TipOne 200 µL rack 15° toward me in the hood" rows="2"></textarea>
        <button id="send">Send</button>
      </form>
      <p class="hint" id="chatHint"></p>
    </section>
  </aside>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pinned = new URLSearchParams(location.search).get("design");

const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-200, -300, 500); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(300, 200, 200); scene.add(fill);

let group = null, current = null;
const loader = new STLLoader();
const load = (url) => new Promise((ok, fail) => loader.load(url, (geo) => { geo.computeVertexNormals(); ok(geo); }, undefined, fail));

function themeColors() {
  renderer.setClearColor(css("--bg"));
}

async function show(sceneData) {
  current = sceneData;
  const pose = $("printPose").checked;
  const partGeo = await load(`/files/${sceneData.id}/${pose ? sceneData.print_file : sceneData.part}`);
  const next = new THREE.Group();
  next.add(new THREE.Mesh(partGeo, new THREE.MeshStandardMaterial({ color: css("--part"), roughness: 0.55 })));
  const ghosts = new THREE.Group(); ghosts.name = "ghosts";
  if (!pose) {
    for (const gh of sceneData.ghosts) {
      const geo = await load(`/files/${sceneData.id}/${gh.file}`);
      ghosts.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: css("--ghost"), transparent: true,
        opacity: 0.42, roughness: 0.4, depthWrite: false })));
    }
  }
  ghosts.visible = $("showGhosts").checked;
  next.add(ghosts);
  const box = new THREE.Box3().setFromObject(next);
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  // a 10 mm grid on the bench, and a 50 mm scale bar in front of the part
  const span = Math.ceil(Math.max(size.x, size.y) / 10) * 10 + 40;
  const grid = new THREE.GridHelper(span, span / 10, css("--line"), css("--line"));
  grid.rotation.x = Math.PI / 2; grid.position.set(centre.x, centre.y, box.min.z - 0.01);
  next.add(grid);
  const barY = box.min.y - 12, barX = box.min.x;
  const bar = new THREE.Mesh(new THREE.BoxGeometry(50, 2, 1), new THREE.MeshBasicMaterial({ color: css("--accent") }));
  bar.position.set(barX + 25, barY, box.min.z + 0.5); next.add(bar);
  next.add(label("50 mm", barX + 25, barY - 6, box.min.z + 1));
  if (group) scene.remove(group);
  group = next; scene.add(group);
  frame(box);
  $("empty").hidden = true; $("overlay").hidden = false; $("toggles").hidden = false;
  $("overlay").innerHTML = `<b>${sceneData.template}</b> · ${sceneData.size_mm.map((v) => v.toFixed(1)).join(" × ")} mm` +
    (pose ? " · print orientation" : "");
  panels(sceneData);
}

function label(text, x, y, z) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 64;
  const ctx = c.getContext("2d"); ctx.fillStyle = css("--ink"); ctx.font = "bold 34px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 128, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.position.set(x, y, z); s.scale.set(24, 6, 1); return s;
}

function frame(box) {
  const centre = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const radius = size.length() / 2;
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const fitH = radius / Math.sin(fov / 2), fitW = radius / Math.sin(Math.atan(Math.tan(fov / 2) * camera.aspect));
  const dist = 1.15 * Math.max(fitH, fitW);
  controls.target.copy(centre);
  camera.position.copy(centre).add(new THREE.Vector3(-0.55, -1, 0.75).normalize().multiplyScalar(dist));
  controls.update();
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function panels(s) {
  $("about").hidden = $("checks").hidden = $("holds").hidden = $("filesSec").hidden = false;
  const params = Object.entries(s.params).map(([k, v]) => `${esc(k)} = <b>${esc(v)}</b>`).join("<br>");
  $("aboutBody").innerHTML = `<div>${params}</div>` +
    (s.notes?.length ? `<ul class="notes">${s.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : "");
  $("checkList").innerHTML = s.checks.map((c) => {
    const cls = c.ok === true ? "ok" : c.ok === false ? "fail" : "info";
    const mark = c.ok === true ? "✓" : c.ok === false ? "✗" : "·";
    return `<div class="check ${cls}"><span class="mark">${mark}</span><span>${esc(c.name)}: <b>${esc(c.value)}</b>` +
      `<span class="basis">${esc(c.basis)}</span>${c.detail ? `<small>${esc(c.detail)}</small>` : ""}</span></div>`;
  }).join("");
  $("refList").innerHTML = s.references.map((r) => `<div class="ref"><b>${esc(r.name)}</b> — ${esc(r.size)}` +
    `<small>${esc(r.confidence)} · ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source)}</a>` : esc(r.source)} · ${esc(r.license)}</small></div>`).join("");
  $("files").innerHTML = `<a href="/files/${s.id}/print.stl" download="${s.id}.stl">Download STL (print orientation)</a>`;
}

async function refresh(force = false) {
  try {
    const list = await (await fetch("/api/designs")).json();
    const sel = $("designs");
    const want = pinned || sel.dataset.chosen || list.designs[0];
    sel.innerHTML = list.designs.map((d) => `<option ${d === want ? "selected" : ""}>${esc(d)}</option>`).join("");
    if (!want) return;
    if (force || !current || current.id !== want) {
      const res = await fetch(`/api/scene?design=${encodeURIComponent(want)}`);
      if (res.ok) await show(await res.json());
    }
  } catch (e) { /* server restarting */ }
}
$("designs").onchange = (e) => { e.target.dataset.chosen = e.target.value; refresh(true); };
$("showGhosts").onchange = (e) => { const g = group?.getObjectByName("ghosts"); if (g) g.visible = e.target.checked; };
$("printPose").onchange = () => current && show(current);

// chat
let session = null;
const status = await (await fetch("/api/status")).json();
if (!status.chat_available) {
  $("send").disabled = true; $("input").disabled = true;
  $("chatHint").textContent = status.detail;
}
function say(text, who) {
  const div = document.createElement("div"); div.className = `msg ${who}`; div.textContent = text;
  $("log").append(div); $("log").scrollTop = $("log").scrollHeight;
}
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  say(text, "user"); $("input").value = ""; $("send").disabled = true;
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session }) });
    const data = await res.json(); session = data.session || session;
    say(data.reply || data.error || "(no reply)", "bot");
    if (data.designs?.length) { $("designs").dataset.chosen = data.designs.at(-1); refresh(true); }
  } finally { $("send").disabled = false; }
};

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize(); themeColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { themeColors(); current && show(current); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
await refresh(true);
if (!pinned) setInterval(refresh, 2500);
</script>
</body>
</html>
